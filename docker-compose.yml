services:
  duty-reminder:
    build:
      context: .
      args:
        INSTALL_OCR: "${INSTALL_OCR:-false}"
    image: duty-reminder:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      DATA_DIR: "${DATA_DIR:-/app/data}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/uploads}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
      UPLOAD_KEEP_DAYS: "${UPLOAD_KEEP_DAYS:-90}"
      GENERATED_UPLOAD_KEEP_DAYS: "${GENERATED_UPLOAD_KEEP_DAYS:-1}"
      NOTIFICATION_SENDER_TYPE: "${NOTIFICATION_SENDER_TYPE:-lightagent}"
      WECHAT_BRIDGE_ENABLED: "${WECHAT_BRIDGE_ENABLED:-true}"
      WECHAT_BRIDGE_DATA_DIR: "${WECHAT_BRIDGE_DATA_DIR:-/app/wechat}"
      DUTY_REMINDER_QUERY_TOKEN: "${DUTY_REMINDER_QUERY_TOKEN:-520pt}"
      DUTY_REMINDER_PUBLIC_URL: "${DUTY_REMINDER_PUBLIC_URL:-}"
      DUTY_REMINDER_TUNNEL_PROXY: "${DUTY_REMINDER_TUNNEL_PROXY:-}"
      WECOM_CORP_ID: "${WECOM_CORP_ID:-}"
      WECOM_CORP_SECRET: "${WECOM_CORP_SECRET:-}"
      WECOM_AGENT_ID: "${WECOM_AGENT_ID:-}"
      WECOM_AIBOT_ENABLED: "${WECOM_AIBOT_ENABLED:-false}"
      WECOM_AIBOT_ID: "${WECOM_AIBOT_ID:-}"
      WECOM_AIBOT_SECRET: "${WECOM_AIBOT_SECRET:-}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - duty-data:/app/data
      - duty-uploads:/app/uploads
      - duty-wechat:/app/wechat

volumes:
  duty-data:
  duty-uploads:
  duty-wechat:
