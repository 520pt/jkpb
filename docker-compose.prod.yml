services:
  # duty-reminder：后台页面、提醒配置、图片生成、隧道机电查询、内置个人微信群通知。
  duty-reminder:
    image: ghcr.io/520pt/jkpb:latest
    container_name: duty-reminder
    restart: unless-stopped
    ports:
      # 后台端口，浏览器访问 http://服务器IP:2222
      - "2222:8080"
    environment:
      # 时区，保证提醒时间按北京时间计算。
      TZ: Asia/Shanghai

      # 后台登录账号和密码，部署前可以改成自己的。
      ADMIN_USERNAME: 520pt
      ADMIN_PASSWORD: 520pt

      # 启用内置个人微信群桥，不需要再单独部署 LightAgent。
      WECHAT_BRIDGE_ENABLED: "true"

      # 微信登录态、群映射、成员映射保存目录。
      WECHAT_BRIDGE_DATA_DIR: /app/wechat

      # 微信查询接口内部 token，默认即可；不要暴露给外部。
      DUTY_REMINDER_QUERY_TOKEN: 520pt

      # 公网访问地址；企业微信图文卡片点击详情需要这个地址。
      DUTY_REMINDER_PUBLIC_URL: "${DUTY_REMINDER_PUBLIC_URL:-https://jk.79c.cc}"

      # 生成的查询图片/图文详情页默认只保留 1 天，第二天自动清理。
      GENERATED_UPLOAD_KEEP_DAYS: "${GENERATED_UPLOAD_KEEP_DAYS:-1}"

      # 可选：只给智慧养护/隧道机电接口使用的代理出口。
      # 留空不会启用；不会影响企业微信、个人微信群、GitHub 或其他外联。
      DUTY_REMINDER_TUNNEL_PROXY: "${DUTY_REMINDER_TUNNEL_PROXY:-}"

      # 可选：企业微信智能机器人双向交互。也可以部署后在网页「配置中心 → 消息通知渠道」填写。
      WECOM_AIBOT_ENABLED: "${WECOM_AIBOT_ENABLED:-false}"
      WECOM_AIBOT_ID: "${WECOM_AIBOT_ID:-}"
      WECOM_AIBOT_SECRET: "${WECOM_AIBOT_SECRET:-}"
    volumes:
      # 保存数据库、提醒配置、排班数据、隧道机电配置、公路巡查配置。
      - ./data:/app/data

      # 保存上传文件和生成的提醒图片。
      - ./uploads:/app/uploads

      # 保存个人微信扫码登录状态、群 ID 映射、成员 ID 映射。
      - ./wechat:/app/wechat
